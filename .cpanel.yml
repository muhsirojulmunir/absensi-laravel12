---
deployment:
  tasks:
    - export DEPLOYPATH=/home/recordsh/absensi.recordshoes.com
    - export PHP=$(which ea-php84 2>/dev/null || which /opt/cpanel/ea-php84/root/usr/bin/php 2>/dev/null || which /usr/local/bin/ea-php84 2>/dev/null || echo "/usr/local/bin/php")
    - /bin/cp -R * $DEPLOYPATH
    - /bin/cp .env.production $DEPLOYPATH/.env 2>/dev/null; true
    - /bin/cp .htaccess $DEPLOYPATH/.htaccess 2>/dev/null; true
    - /bin/cp public/.htaccess $DEPLOYPATH/public/.htaccess 2>/dev/null; true
    - cd $DEPLOYPATH && $PHP artisan migrate --force 2>/dev/null; true
    - cd $DEPLOYPATH && $PHP artisan optimize:clear 2>/dev/null; true
    - /bin/rm -f $DEPLOYPATH/bootstrap/cache/config.php $DEPLOYPATH/bootstrap/cache/routes*.php 2>/dev/null; true
    # ✅ Auto-register Cron Job untuk Laravel Scheduler (notifikasi otomatis tiap 5 menit)
    # Cek apakah cron schedule:run sudah ada, jika belum tambahkan
    - (crontab -l 2>/dev/null | grep -q "schedule:run" || (crontab -l 2>/dev/null; echo "* * * * * $PHP /home/recordsh/absensi.recordshoes.com/artisan schedule:run >> /dev/null 2>&1") | crontab -) 2>/dev/null; true
