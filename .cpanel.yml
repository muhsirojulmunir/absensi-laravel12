---
deployment:
  tasks:
    - export DEPLOYPATH=/home/recordsh/absensi.recordshoes.com
    - /bin/cp -R * $DEPLOYPATH
    - /bin/cp .env.production $DEPLOYPATH/.env 2>/dev/null; true
    - /bin/cp .htaccess $DEPLOYPATH/.htaccess 2>/dev/null; true
    - cd $DEPLOYPATH && /usr/local/bin/php artisan migrate --force 2>/dev/null; true
    - cd $DEPLOYPATH && /usr/local/bin/php artisan config:cache 2>/dev/null; true
    - cd $DEPLOYPATH && /usr/local/bin/php artisan route:cache 2>/dev/null; true
    - cd $DEPLOYPATH && /usr/local/bin/php artisan view:cache 2>/dev/null; true
